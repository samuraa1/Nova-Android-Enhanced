name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: nova-xray/go.mod
          cache-dependency-path: |
            nova-xray/go.sum
            nova-proxy/go.sum
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build optional native engines from source
        env:
          CGO_ENABLED: '1'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash nova-xray/build.sh
          bash tools/build_nova_proxy.sh
      - name: Build and test
        run: ./gradlew --no-daemon :app:assembleGithubDebug :app:testGithubDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-android-debug
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/reports/tests/testGithubDebugUnitTest/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

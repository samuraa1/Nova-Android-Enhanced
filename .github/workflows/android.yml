name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: nova-xray/go.mod
          cache-dependency-path: |
            nova-xray/go.sum
            nova-proxy/go.sum
      - name: Install Android build tools
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}"
          manager="$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [[ -z "$manager" ]]; then
            archive="$RUNNER_TEMP/nova-android-tools.zip"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$archive"
            printf '%s  %s\n' '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583' "$archive" | sha256sum --check
            unzip -q "$archive" -d "$RUNNER_TEMP/nova-android-tools"
            manager="$RUNNER_TEMP/nova-android-tools/cmdline-tools/bin/sdkmanager"
          fi
          mkdir -p "$sdk"
          printf 'y\n%.0s' {1..20} | "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Build optional native engines from source
        env:
          CGO_ENABLED: '1'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash nova-xray/build.sh
          bash tools/build_nova_proxy.sh
      - name: Build and test
        run: ./gradlew --no-daemon :app:assembleGithubDebug :app:testGithubDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-android-debug
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/reports/tests/testGithubDebugUnitTest/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
